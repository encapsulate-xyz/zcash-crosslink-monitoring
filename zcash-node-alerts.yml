groups:
  - name: zcash_node_alerts
    rules:
      - alert: ZcashNodeDown
        expr: up{job="zcash"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Zcash node is down (instance {{ $labels.instance }})"
          description: "Prometheus has been unable to scrape the node's metrics endpoint for over 2 minutes."

      - alert: ZcashSyncStalled
        expr: increase(zcash_chain_verified_block_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Zcash chain synchronization is stalled (instance {{ $labels.instance }})"
          description: "No new blocks have been verified in the past 10 minutes."

      - alert: ZcashHighDistanceToTip
        expr: sync_estimated_distance_to_tip > 12
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Zcash node is falling behind network tip (instance {{ $labels.instance }})"
          description: "Zcash node is currently {{ $value }} blocks behind the network tip for over 5 minutes."

      - alert: ZcashNoPeersConnected
        expr: max by (instance) (zcash_net_peers) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Zcash node has zero connected peers (instance {{ $labels.instance }})"
          description: "The node has lost all peer connections and is isolated from the Zcash P2P network."

      - alert: ZcashLowPeers
        expr: max by (instance) (zcash_net_peers) < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Zcash node has few connected peers (instance {{ $labels.instance }})"
          description: "The node has only {{ $value }} connected peers for over 10 minutes."

      - alert: ZcashMempoolHighTransactionRejectionRate
        expr: sum by (instance) (rate(mempool_failed_verify_tasks_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of mempool transaction verification failures (instance {{ $labels.instance }})"
          description: "Mempool verification failure rate is {{ $value | printf \"%.2f\" }} failures/sec."

      - alert: ZcashRpcHighLatency
        expr: rpc_request_duration_seconds{quantile="0.95"} > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JSON-RPC latency on Zcash node (instance {{ $labels.instance }})"
          description: "Method {{ $labels.method }} 95th percentile response latency is {{ $value | printf \"%.3f\" }}s (>100ms)."

      - alert: ZcashRpcHighErrorRate
        expr: sum by (instance) (rate(rpc_errors_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JSON-RPC error rate (instance {{ $labels.instance }})"
          description: "Zcash RPC server is generating {{ $value | printf \"%.2f\" }} errors per second."
